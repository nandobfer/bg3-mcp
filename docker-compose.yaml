services:
  bg3-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    env_file:
      - .env
    ports:
      - "${BG3_MCP_PORT}:${BG3_MCP_PORT}"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD-SHELL
        - curl --fail --silent --show-error "http://127.0.0.1:$${BG3_MCP_PORT}/health" >/dev/null
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
